openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public catalog and SEO endpoints
  - name: admin
    description: Private content management endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /posts:
    get:
      operationId: listPosts
      tags: [public]
      summary: List published posts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Published posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
  /posts/{slug}:
    get:
      operationId: getPost
      tags: [public]
      summary: Get a published post
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
  /media/{assetId}:
    get:
      operationId: getMediaAsset
      tags: [public]
      summary: Get a compressed internally stored post image
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compressed image bytes
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid media asset request
        "404":
          description: Media asset not found
  /categories:
    get:
      operationId: listCategories
      tags: [public]
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [public]
      summary: Get public SEO and analytics settings
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in to the admin workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out of the admin workspace
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Unauthorized
  /admin/posts:
    get:
      operationId: listAdminPosts
      tags: [admin]
      summary: List posts for moderation
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [published, draft, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Admin post list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPost"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAllAdminPosts
      tags: [admin]
      summary: Permanently delete every post
      responses:
        "200":
          description: Bulk deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPostDeletionResult"
        "401":
          description: Unauthorized
  /admin/posts/{id}:
    patch:
      operationId: updateAdminPost
      tags: [admin]
      summary: Update post visibility or metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "401":
          description: Unauthorized
  /admin/tmdb/enrich:
    post:
      operationId: enrichAdminTmdbPosts
      tags: [admin]
      summary: Enrich a controlled batch of posts with TMDB metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmdbEnrichmentInput"
      responses:
        "200":
          description: Enrichment batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbEnrichmentResult"
        "400":
          description: TMDB key is unavailable or request is invalid
        "401":
          description: Unauthorized
  /admin/posts/source-images/refresh:
    post:
      operationId: refreshAdminPostSourceImages
      tags: [admin]
      summary: Refresh source screenshot galleries for a bounded batch of posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceImageRefreshInput"
      responses:
        "200":
          description: Source image refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceImageRefreshResult"
        "400":
          description: Invalid refresh request
        "401":
          description: Unauthorized
  /admin/posts/media/backfill:
    post:
      operationId: backfillAdminPostMedia
      tags: [admin]
      summary: Move a bounded batch of legacy post images into private app storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMediaBackfillInput"
      responses:
        "200":
          description: Post media backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMediaBackfillResult"
        "400":
          description: Invalid backfill request
        "401":
          description: Unauthorized
  /admin/import:
    post:
      operationId: importPosts
      tags: [admin]
      summary: Import authorized post listings from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid URL or source
        "401":
          description: Unauthorized
  /admin/sitemaps/discover:
    post:
      operationId: discoverSitemaps
      tags: [admin]
      summary: Discover post sitemaps from an authorized source URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitemapDiscoveryInput"
      responses:
        "200":
          description: Discovered post sitemaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapDiscoveryResult"
        "400":
          description: Invalid URL or source
        "401":
          description: Unauthorized
  /admin/sitemaps/scrape:
    post:
      operationId: scrapeSitemap
      tags: [admin]
      summary: Scrape one sitemap in a bounded batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitemapScrapeInput"
      responses:
        "200":
          description: Sitemap scrape batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapScrapeResult"
        "400":
          description: Invalid sitemap or source
        "401":
          description: Unauthorized
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get site settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          description: Unauthorized
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update SEO and analytics settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          description: Unauthorized
  /admin/tmdb-key:
    get:
      operationId: getAdminTmdbApiKey
      tags: [admin]
      summary: Get TMDB API key status
      responses:
        "200":
          description: TMDB API key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTmdbApiKeyStatus"
        "401":
          description: Unauthorized
    put:
      operationId: saveAdminTmdbApiKey
      tags: [admin]
      summary: Save or replace the TMDB API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmdbApiKeyInput"
      responses:
        "200":
          description: Saved TMDB API key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTmdbApiKeyStatus"
        "400":
          description: Invalid API key
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAdminTmdbApiKey
      tags: [admin]
      summary: Delete the TMDB API key
      responses:
        "200":
          description: Deleted TMDB API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
  /admin/sitemap:
    get:
      operationId: getAdminSitemap
      tags: [admin]
      summary: Get sitemap health information
      responses:
        "200":
          description: Sitemap information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapInfo"
        "401":
          description: Unauthorized
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, postCount]
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        postCount: { type: number }
    Post:
      type: object
      required: [id, title, slug, thumbnailUrl, sourceImageUrls, excerpt, category, publishedAt]
      properties:
        id: { type: number }
        title: { type: string }
        slug: { type: string }
        thumbnailUrl: { type: string }
        sourceImageUrls:
          type: array
          items: { type: string }
        excerpt: { type: string }
        sourceUrl: { type: ["string", "null"] }
        category:
          $ref: "#/components/schemas/Category"
        publishedAt: { type: string, format: date-time }
        tmdb:
          $ref: "#/components/schemas/TmdbMetadata"
    AdminPost:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          required:
            [
              status,
              sourceDomain,
              titleSource,
              sourceTitle,
              detectedTitle,
              titleMatchStatus,
              titleMatchConfidence,
              titleMatchType,
              titleMatchYear,
              tmdbId,
              tmdbMediaType,
              tmdbEnrichmentStatus,
            ]
          properties:
            status:
              type: string
              enum: [published, draft]
            sourceDomain: { type: string }
            titleSource:
              type: string
              enum: [auto, manual]
            sourceTitle: { type: ["string", "null"] }
            detectedTitle: { type: ["string", "null"] }
            titleMatchStatus:
              type: string
              enum: [matched, review, unmatched, unavailable]
            titleMatchConfidence:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            titleMatchType:
              type: ["string", "null"]
              enum: [movie, tv, null]
            titleMatchYear:
              type: ["number", "null"]
            tmdbId:
              type: ["number", "null"]
            tmdbMediaType:
              type: ["string", "null"]
              enum: [movie, tv, null]
            tmdbEnrichmentStatus:
              type: string
              enum: [pending, ready, review, unmatched, unavailable, failed]
    TmdbCastMember:
      type: object
      required: [name, character, profileUrl]
      properties:
        name: { type: string }
        character: { type: ["string", "null"] }
        profileUrl: { type: ["string", "null"] }
    TmdbRelatedTitle:
      type: object
      required: [id, mediaType, title, year, posterUrl]
      properties:
        id: { type: number }
        mediaType: { type: string, enum: [movie, tv] }
        title: { type: string }
        year: { type: ["number", "null"] }
        posterUrl: { type: ["string", "null"] }
    EditorialReview:
      type: object
      required: [intro, overview, audience, production, credits]
      properties:
        intro: { type: string }
        overview: { type: ["string", "null"] }
        audience: { type: ["string", "null"] }
        production: { type: ["string", "null"] }
        credits: { type: ["string", "null"] }
    TmdbMetadata:
      type: object
      required:
        [
          id,
          mediaType,
          title,
          originalTitle,
          overview,
          releaseDate,
          year,
          runtime,
          language,
          genres,
          rating,
          voteCount,
          revenue,
          budget,
          posterUrl,
          backdropUrl,
          tagline,
          editorialSummary,
          review,
          director,
          cast,
          trailerUrl,
          imdbId,
          keywords,
          related,
          tmdbUrl,
          attribution,
          syncedAt,
        ]
      properties:
        id: { type: number }
        mediaType: { type: string, enum: [movie, tv] }
        title: { type: string }
        originalTitle: { type: ["string", "null"] }
        overview: { type: ["string", "null"] }
        releaseDate: { type: ["string", "null"] }
        year: { type: ["number", "null"] }
        runtime: { type: ["number", "null"] }
        language: { type: ["string", "null"] }
        genres:
          type: array
          items: { type: string }
        rating: { type: ["number", "null"] }
        voteCount: { type: ["number", "null"] }
        revenue: { type: ["number", "null"] }
        budget: { type: ["number", "null"] }
        posterUrl: { type: ["string", "null"] }
        backdropUrl: { type: ["string", "null"] }
        tagline: { type: ["string", "null"] }
        editorialSummary: { type: string }
        review:
          $ref: "#/components/schemas/EditorialReview"
        director: { type: ["string", "null"] }
        cast:
          type: array
          items:
            $ref: "#/components/schemas/TmdbCastMember"
        trailerUrl: { type: ["string", "null"] }
        imdbId: { type: ["string", "null"] }
        keywords:
          type: array
          items: { type: string }
        related:
          type: array
          items:
            $ref: "#/components/schemas/TmdbRelatedTitle"
        tmdbUrl: { type: string }
        attribution: { type: string }
        syncedAt: { type: string, format: date-time }
    TmdbEnrichmentInput:
      type: object
      properties:
        limit: { type: number, minimum: 1, maximum: 25, default: 10 }
        includeReviewed: { type: boolean, default: false }
    TmdbEnrichmentResult:
      type: object
      required: [attempted, enriched, review, unmatched, unavailable, failed]
      properties:
        attempted: { type: number }
        enriched: { type: number }
        review: { type: number }
        unmatched: { type: number }
        unavailable: { type: number }
        failed: { type: number }
    SourceImageRefreshInput:
      type: object
      properties:
        limit: { type: number, minimum: 1, maximum: 25, default: 10 }
    SourceImageRefreshResult:
      type: object
      required: [attempted, refreshed, failed]
      properties:
        attempted: { type: number }
        refreshed: { type: number }
        failed: { type: number }
    PostMediaBackfillInput:
      type: object
      properties:
        limit: { type: number, minimum: 1, maximum: 10, default: 5 }
    PostMediaBackfillResult:
      type: object
      required: [attempted, migrated, remaining]
      properties:
        attempted: { type: number }
        migrated: { type: number }
        remaining: { type: number }
    PostList:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        page: { type: number }
        limit: { type: number }
        total: { type: number }
        totalPages: { type: number }
    PublicSettings:
      type: object
      required: [siteName, siteDescription, analyticsId]
      properties:
        siteName: { type: string }
        siteDescription: { type: string }
        analyticsId: { type: ["string", "null"] }
    AdminSettings:
      type: object
      required: [siteName, siteDescription, analyticsId, contactEmail]
      properties:
        siteName: { type: string }
        siteDescription: { type: string }
        analyticsId: { type: ["string", "null"] }
        contactEmail: { type: string }
    AdminTmdbApiKeyStatus:
      type: object
      required: [configured, maskedKey]
      properties:
        configured: { type: boolean }
        maskedKey: { type: ["string", "null"] }
    TmdbApiKeyInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 256 }
    SettingsUpdate:
      type: object
      properties:
        siteName: { type: string, minLength: 1 }
        siteDescription: { type: string }
        analyticsId: { type: ["string", "null"] }
        contactEmail: { type: string }
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        email: { type: ["string", "null"] }
    PostUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        status:
          type: string
          enum: [published, draft]
        categoryId: { type: ["number", "null"] }
    ImportInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ImportResult:
      type: object
      required: [sourceUrl, imported, skipped, items]
      properties:
        sourceUrl: { type: string }
        imported: { type: number }
        skipped: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPost"
    SitemapDiscoveryInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
    SitemapEntry:
      type: object
      required: [id, url, postCount]
      properties:
        id: { type: string }
        url: { type: string }
        postCount: { type: number }
    SitemapDiscoveryResult:
      type: object
      required: [sourceUrl, sitemapUrl, sitemaps]
      properties:
        sourceUrl: { type: string }
        sitemapUrl: { type: string }
        sitemaps:
          type: array
          items:
            $ref: "#/components/schemas/SitemapEntry"
    SitemapScrapeInput:
      type: object
      required: [sitemapId, sitemapUrl, offset]
      properties:
        sitemapId: { type: string }
        sitemapUrl: { type: string }
        offset: { type: number }
    SitemapScrapeResult:
      type: object
      required: [sitemapUrl, offset, processed, total, imported, skipped, failed, nextOffset]
      properties:
        sitemapUrl: { type: string }
        offset: { type: number }
        processed: { type: number }
        total: { type: number }
        imported: { type: number }
        skipped: { type: number }
        failed: { type: number }
        nextOffset: { type: ["number", "null"] }
    AdminSummary:
      type: object
      required: [publishedPosts, draftPosts, categories, lastImportAt]
      properties:
        publishedPosts: { type: number }
        draftPosts: { type: number }
        categories: { type: number }
        lastImportAt: { type: ["string", "null"], format: date-time }
    BulkPostDeletionResult:
      type: object
      required: [success, deletedCount]
      properties:
        success: { type: boolean }
        deletedCount: { type: number }
    SitemapInfo:
      type: object
      required: [url, indexedUrls, lastGeneratedAt]
      properties:
        url: { type: string }
        indexedUrls: { type: number }
        lastGeneratedAt: { type: ["string", "null"], format: date-time }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

